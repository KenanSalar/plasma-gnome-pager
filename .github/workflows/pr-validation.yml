name: PR Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The jobs only read the tree.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & headless tests
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # Before checkout, so it finds git and clones rather than falling back to the REST API.
      - name: Install Qt6 + Plasma 6 QML toolchain
        run: >-
          dnf -y install
          make git dbus-daemon
          qt6-qtdeclarative-devel
          kf6-kirigami kf6-kdeclarative
          plasma-workspace

      - name: Check out the repository
        uses: actions/checkout@v5

      - name: qmllint
        run: make lint

      # ToolTipArea's plugin wants a session bus, and the container has none.
      - name: Headless QML tests (unit + integration)
        run: dbus-run-session -- make check

  # ESLint needs only Node, which is far cheaper than the Fedora container.
  js-lint:
    name: ESLint (strict, JS tier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev tooling
        run: npm ci

      - name: ESLint
        run: make lint-js
