name: PR Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The jobs only read the tree.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & headless tests
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # Before checkout, so it finds git and clones rather than falling back to the REST API.
      - name: Install Qt6 + Plasma 6 QML toolchain
        run: >-
          dnf -y install
          make git dbus-daemon
          qt6-qtdeclarative-devel
          kf6-kirigami kf6-kdeclarative
          plasma-workspace

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: qmllint
        run: make lint

      # ToolTipArea's plugin wants a session bus, and the container has none.
      - name: Headless QML tests (unit + integration)
        run: dbus-run-session -- make check

  # The oxc tools need only Node, which is far cheaper than the Fedora container.
  lint-js:
    name: Oxlint (JS tier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Oxlint
        run: make lint-js

  format:
    name: Oxfmt (format check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Oxfmt
        run: make format-check
