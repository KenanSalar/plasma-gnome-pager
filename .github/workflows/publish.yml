name: Publish

# Drafts a GitHub release with the .plasmoid from a pushed v*.*.* tag, which has to equal
# metadata.json's KPlugin.Version. Editing the notes and publishing the draft by hand is the QA step;
# the KDE Store upload is manual, as the store has no stable upload API.
#
# Releasing: bump KPlugin.Version on main, push v<Version>, wait for the draft, publish it.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# One group for every run, not one per ref: a tag push and a dispatch of the same version share one
# draft. A run is never cancelled mid-upload.
concurrency:
  group: publish
  cancel-in-progress: false

# To create the release, and on the dispatch path the tag it doesn't have yet.
permissions:
  contents: write

jobs:
  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No release yet creates a draft, a draft gets its .plasmoid refreshed, a published one is skipped.
      - name: Resolve version and release state
        id: gate
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(jq -r '.KPlugin.Version' package/metadata.json)
          ID=$(jq -r '.KPlugin.Id' package/metadata.json)
          TAG="v${VERSION}"
          # The .plasmoid's name and the installed version come from metadata.json, not the tag.
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$TAG" ]; then
            echo "::error::Tag ${REF_NAME} does not match package/metadata.json's ${TAG}."
            echo "::error::Fix .KPlugin.Version on main, then re-point the tag."
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "id=${ID}"
            echo "tag=${TAG}"
            echo "plasmoid=dist/${ID}-${VERSION}.plasmoid"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              echo "mode=update" >> "$GITHUB_OUTPUT"
              echo "==> draft ${TAG} exists -> refresh its .plasmoid asset"
            else
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "==> ${TAG} already published -> nothing to do (bump the version to release again)"
            fi
          else
            echo "mode=create" >> "$GITHUB_OUTPUT"
            echo "==> no release for ${TAG} -> create a fresh draft"
          fi

      # msgfmt for the catalogs; the runner has the rest, and packaging needs no Qt.
      - name: Install packaging tools
        if: steps.gate.outputs.mode != 'skip'
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Build the .plasmoid
        if: steps.gate.outputs.mode != 'skip'
        run: make package VERSION="${{ steps.gate.outputs.version }}"

      # --target matters only on the dispatch path, keeping the draft on the commit it was built from.
      - name: Create draft release
        if: steps.gate.outputs.mode == 'create'
        run: |
          gh release create "${{ steps.gate.outputs.tag }}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Plasma Gnome Pager ${{ steps.gate.outputs.tag }}" \
            --generate-notes \
            "${{ steps.gate.outputs.plasmoid }}"

      # The notes may already be edited, so only the .plasmoid is replaced.
      - name: Refresh draft asset
        if: steps.gate.outputs.mode == 'update'
        run: |
          gh release upload "${{ steps.gate.outputs.tag }}" \
            "${{ steps.gate.outputs.plasmoid }}" --clobber
