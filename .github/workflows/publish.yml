name: Publish

# Cut a draft GitHub Release from a pushed `v*.*.*` tag. package/metadata.json's .KPlugin.Version
# is the single source of truth and the tag has to agree -- the gate below fails the run on a
# mismatch, so the bump and the tag are one act rather than two that can drift. The release is
# created as a DRAFT carrying the built .plasmoid + GitHub's auto-generated notes; you edit the
# description and publish manually, which is the QA step. The KDE Store upload is separate and
# manual (the store has no stable upload API).
#
# Releasing: bump .KPlugin.Version on main, push v<Version>, wait for the draft, publish it.
# Landing a PR on main ships nothing on its own.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# One group for every release run, keyed on nothing: the shared resource is the draft, not the ref
# that reached it, so a tag push racing a dispatch of the same version would otherwise be two
# groups clobbering one draft. Never cancel a run mid-upload.
concurrency:
  group: publish
  cancel-in-progress: false

# Write is needed to create the release, and to create the tag at publish time on the dispatch
# path (where the tag doesn't exist yet). Nothing else.
permissions:
  contents: write

jobs:
  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Resolve version/id from metadata.json (the SSOT) and decide the action:
      #   no release for the tag      -> create  (a fresh draft)
      #   existing release is a draft -> update  (refresh the .plasmoid, keep edited notes)
      #   existing release published  -> skip    (bump the version to start a new cycle)
      - name: Resolve version and release state
        id: gate
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(jq -r '.KPlugin.Version' package/metadata.json)
          ID=$(jq -r '.KPlugin.Id' package/metadata.json)
          TAG="v${VERSION}"
          # The tag fires the run, but metadata.json is what the .plasmoid's filename and the
          # installed package's version carry, so a mismatch would ship a package naming a
          # different release. Caught here rather than drafted and published.
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$TAG" ]; then
            echo "::error::Tag ${REF_NAME} does not match package/metadata.json's ${TAG}."
            echo "::error::Fix .KPlugin.Version on main, then re-point the tag."
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "id=${ID}"
            echo "tag=${TAG}"
            echo "plasmoid=dist/${ID}-${VERSION}.plasmoid"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              echo "mode=update" >> "$GITHUB_OUTPUT"
              echo "==> draft ${TAG} exists -> refresh its .plasmoid asset"
            else
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "==> ${TAG} already published -> nothing to do (bump the version to release again)"
            fi
          else
            echo "mode=create" >> "$GITHUB_OUTPUT"
            echo "==> no release for ${TAG} -> create a fresh draft"
          fi

      # gettext provides msgfmt, which `make package` calls via its i18n dependency. gh / jq / zip /
      # make are preinstalled on ubuntu-latest; no Qt/Plasma toolchain is needed (packaging is just
      # zip + compiled .mo catalogs).
      - name: Install packaging tools
        if: steps.gate.outputs.mode != 'skip'
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Build the .plasmoid
        if: steps.gate.outputs.mode != 'skip'
        run: make package VERSION="${{ steps.gate.outputs.version }}"

      # New version: open the draft at the tagged commit with auto-generated notes + the .plasmoid.
      # --target is ignored once the tag exists (the push path); it's what keeps a dispatch-created
      # draft pointed at the commit it was built from rather than main's HEAD at publish time.
      - name: Create draft release
        if: steps.gate.outputs.mode == 'create'
        run: |
          gh release create "${{ steps.gate.outputs.tag }}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Plasma Gnome Pager ${{ steps.gate.outputs.tag }}" \
            --generate-notes \
            "${{ steps.gate.outputs.plasmoid }}"

      # Draft already exists (e.g. the tag was re-pointed before you published): swap in the rebuilt
      # .plasmoid but DO NOT touch the description -- it may already be hand-edited.
      - name: Refresh draft asset
        if: steps.gate.outputs.mode == 'update'
        run: |
          gh release upload "${{ steps.gate.outputs.tag }}" \
            "${{ steps.gate.outputs.plasmoid }}" --clobber
